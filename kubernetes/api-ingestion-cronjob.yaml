apiVersion: batch/v1
kind: CronJob
metadata:
  name: opensky-api-ingestion
  namespace: logistics
spec:
  schedule: "*/15 * * * *"  # Every 15 minutes
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: api-ingestion
            image: acrlogisticsplatform.azurecr.io/logistics-ingestion:latest
            command: ["python", "ingestion/api/opensky_ingestion.py"]
            env:
            - name: STORAGE_ACCOUNT_NAME
              value: "stlogisticsplatform"
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: azure-credentials
                  key: client-id
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: azure-credentials
                  key: client-secret
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: azure-credentials
                  key: tenant-id
          restartPolicy: OnFailure